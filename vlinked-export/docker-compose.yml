version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vlinked-postgres
    environment:
      POSTGRES_USER: vlinked
      POSTGRES_PASSWORD: vlinked_password
      POSTGRES_DB: vlinked
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlinked"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: vlinked-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage for local dev)
  minio:
    image: minio/minio:latest
    container_name: vlinked-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Server
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vlinked-api
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://vlinked:vlinked_password@postgres:5432/vlinked
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vlinked-uploads
      JWT_SECRET: your-jwt-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run dev"

  # Video Processing Worker
  video-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vlinked-video-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vlinked:vlinked_password@postgres:5432/vlinked
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: vlinked-uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run worker:video

  # AI Analysis Worker
  ai-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vlinked-ai-worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vlinked:vlinked_password@postgres:5432/vlinked
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run worker:ai

  # Feed Indexer (runs periodically)
  feed-indexer:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: vlinked-feed-indexer
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vlinked:vlinked_password@postgres:5432/vlinked
      REDIS_URL: redis://redis:6379
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run indexer:feed

volumes:
  postgres_data:
  redis_data:
  minio_data:
